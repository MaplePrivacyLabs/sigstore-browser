name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['26.13.1', '24.22.2']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Require release metadata before installation
        id: mode
        run: node scripts/ci-mode.mjs
      - run: npm ci
        if: steps.mode.outputs.release == 'false'
      - run: npm ci --ignore-scripts
        if: steps.mode.outputs.release == 'true'
      - run: node node_modules/typescript/bin/tsc --project tsconfig.json
        if: steps.mode.outputs.release == 'false'
      - run: npx eslint .
      - run: npm run test:node
      - run: node test/runtime-matrix.ts
      - run: node test/runtime-matrix.ts
        env:
          NO_NATIVE_ED25519: '1'
      - run: npx playwright install --with-deps chromium firefox webkit
        if: matrix.node == '26.13.1'
      - run: npm run test:browsers
        if: matrix.node == '26.13.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.node == '26.13.1'
        with:
          bun-version: '1.3.5'
      - run: bun test/runtime-matrix.ts
        if: matrix.node == '26.13.1'
      - run: bun test/runtime-matrix.ts
        if: matrix.node == '26.13.1'
        env:
          NO_NATIVE_ED25519: '1'
      - run: node scripts/check-release.mjs
        if: steps.mode.outputs.release == 'true' && matrix.node == '26.13.1'
