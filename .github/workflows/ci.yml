# .github/workflows/ci.yml
name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.13.1'

      - name: Require release metadata before installation
        id: mode
        run: node scripts/ci-mode.mjs
      - run: npm ci
        if: steps.mode.outputs.release == 'false'
      - run: npm ci --ignore-scripts
        if: steps.mode.outputs.release == 'true'
      - run: npx eslint .
      - run: node node_modules/typescript/bin/tsc --project tsconfig.json
        if: steps.mode.outputs.release == 'false'
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node scripts/check-release.mjs
        if: steps.mode.outputs.release == 'true'
